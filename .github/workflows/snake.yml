name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f0f6fc&color_dots=#161b22,#0d2b52,#144a8a,#1f6feb,#58a6ff&color_dot_border=#0d1117
            dist/snake-light.svg?color_snake=#24292f&color_dots=#ebedf0,#b6e3ff,#54aeff,#0969da,#0a3069&color_dot_border=#ffffff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
